<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Property Price Predictor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
            #bg-video {
      position: fixed;
      right: 0;
      bottom: 0;
      min-width: 100%;
      min-height: 100%;
      z-index: -1;
      object-fit: cover;
    }
        .custom-navbar {
            background: var(--primary-gradient);
            padding: 1rem 0.5rem;
            border-radius: 0 0 20px 20px;
            box-shadow: var(--card-shadow);
        }

        ul li a{
            /* color: black; */
            font-weight: bold;
        }
        .custom-navbar .nav-link {
            transition: color 0.2s, transform 0.2s;
        }

        .custom-navbar .nav-link:hover {
            color: black;
            transform: translateY(-2px);
        }

        .navbar-toggler {
            border-color: rgba(255, 255, 255, 0.4);
        }

        :root {
            --primary-gradient: linear-gradient(135deg, rgb(136, 186, 244) 0%, rgb(136, 186, 244) 100%);
            --card-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            background-color: #000000;
        }

        .page-title {
            color: rgb(136, 186, 244);
            font-size: 2.5rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 2rem;
        }

        .form-card {
            background: rgb(136, 186, 244);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: var(--card-shadow);
            margin-bottom: 2rem;
        }

        .feature-icon {
            color: black;
            margin-right: 0.5rem;
        }

        .form-label {
            font-weight: 600;
            color: #1e293b;
            display: flex;
            align-items: center;
        }

        .form-control,
        .form-select {
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 0.75rem 1rem;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: rgb(136, 186, 244);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .btn-predict {
            background: black;
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 10px;
            font-weight: 600;
            transition: transform 0.2s;
        }

        .btn-predict:hover {
            transform: translateY(-2px);
            background-color: white;
            color: black;
        }

        .prediction-card {
            background: var(--primary-gradient);
            color: white;
            border-radius: 20px;
            padding: 2rem;
            text-align: center;
        }

        .prediction-value {
            font-size: 3rem;
            font-weight: 800;
            margin: 1rem 0;
        }

        .back-link {
            background-color: rgb(136, 186, 244);
            padding: 1rem;
            border-radius: 10px;
            color: black;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            margin-bottom: 1rem;
            font-weight: bold;
        }

        .back-link:hover {
            color: rgb(0, 0, 0);
            background-color: rgb(197, 218, 243);
            transform: translateY(-2px);
        }

        .footer {
      text-align: center;
      padding: 2rem 1rem;
      color: #94a3b8;
    }
    </style>
</head>

<body>
    <video autoplay muted loop id="bg-video">
        <source src="{{url_for('static',filename='graph.mp4')}}" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    <nav class="navbar navbar-expand-lg custom-navbar mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-white" href="#">
                <i class="fas fa-home me-2"></i>PricePredictor
            </a>
            <button class="navbar-toggler text-white" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item mx-2">
                        <a class="nav-link text-white fw-semibold" href="/">HOME</a>
                    </li>
                    <li class="nav-item mx-2">
                        <a class="nav-link text-white fw-semibold" href="#prediction-form">PREDICTION</a>
                    </li>
                    <li class="nav-item mx-2">
                        <a class="nav-link text-white fw-semibold" href="/about">ABOUT</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <a href="/" class="back-link">
            <i class="fas fa-arrow-left me-2"></i>Back to Home
        </a>

        <h1 class="page-title">Property Price Predictor</h1>

        <div class="row">
            <div class="col-lg-8 mx-auto">
                <div class="form-card">
                    <form id="prediction-form">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">
                                    <i class="fas fa-ruler-combined feature-icon"></i>Total Area (sq ft)
                                </label>
                                <input type="range" class="form-range" id="area" name="area" min="{{ min_area }}"
                                    max="{{ max_area }}" value="{{ avg_area }}">
                                <div class="d-flex justify-content-between">
                                    <span class="small text-muted">{{ min_area }}</span>
                                    <span id="area-value" class="small text-primary fw-bold">{{ avg_area }}</span>
                                    <span class="small text-muted">{{ max_area }}</span>
                                </div>
                            </div>

                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">
                                    <i class="fas fa-bath feature-icon"></i>Number of Bathrooms
                                </label>
                                <input type="range" class="form-range" id="baths" name="baths" min="{{ min_baths }}"
                                    max="{{ max_baths }}" value="2" step="1">
                                <div class="d-flex justify-content-between">
                                    <span class="small text-muted">{{ min_baths }}</span>
                                    <span id="baths-value" class="small text-primary fw-bold">2</span>
                                    <span class="small text-muted">{{ max_baths }}</span>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">
                                    <i class="fas fa-bed feature-icon"></i>Number of BHK
                                </label>
                                <input type="range" class="form-range" id="bhk" name="bhk" min="1" max="6" value="2"
                                    step="1">
                                <div class="d-flex justify-content-between">
                                    <span class="small text-muted">1</span>
                                    <span id="bhk-value" class="small text-primary fw-bold">2</span>
                                    <span class="small text-muted">6</span>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">
                                    <i class="fas fa-rupee-sign feature-icon"></i>Price per Sq ft
                                </label>
                                <input type="number" class="form-control" id="price_per_sqft" name="price_per_sqft"
                                    value="5000" min="1000" max="60000">
                            </div>
                        </div>

                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label class="form-label">
                                    <i class="fas fa-city feature-icon"></i>City
                                </label>
                                <input type="text" class="form-control" id="city" name="city" list="cityList" required
                                    placeholder="Search city...">
                                <datalist id="cityList">
                                    {% for city in cities %}
                                    <option value="{{ city }}">
                                        {% endfor %}
                                </datalist>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">
                                    <i class="fas fa-map-marker-alt feature-icon"></i>Location
                                </label>
                                <select class="form-select" id="location" name="location" required>
                                    <option value="">Select Location</option>
                                    {% for location in locations %}
                                    <option value="{{ location }}">{{ location }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="text-center">
                            <button type="submit" class="btn btn-predict">
                                <i class="fas fa-calculator"></i>Predict Price
                            </button>
                        </div>
                    </form>
                </div>

                <div class="prediction-card" id="prediction-result" style="display: none;">
                    <h3 class="text-center mb-3">Predicted Property Price</h3>
                    <div class="prediction-value" id="prediction-value">₹0</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.7.1/gsap.min.js"></script>
    <script>
        // Update range slider values
        function updateValue(id) {
            const slider = document.getElementById(id);
            const output = document.getElementById(id + '-value');
            output.textContent = slider.value;
        }

        ['area', 'baths', 'bhk'].forEach(id => {
            const slider = document.getElementById(id);
            slider.oninput = () => updateValue(id);
        });

        // Update locations based on selected city
        $('#city').change(function () {
            const city = $(this).val();
            if (city) {
                $.get(`/get_locations/${city}`, function (locations) {
                    const locationSelect = $('#location');
                    locationSelect.empty();
                    locationSelect.append('<option value="">Select Location</option>');
                    locations.forEach(location => {
                        locationSelect.append(`<option value="${location}">${location}</option>`);
                    });
                });
            }
        });

        // Handle form submission
        // Initialize animations
        gsap.from('.form-card', {
            duration: 1,
            y: 30,
            opacity: 0,
            ease: 'power3.out',
            delay: 0.2
        });

        // Form submission
        $('#prediction-form').submit(function (e) {
            e.preventDefault();

            const formData = {
                area: $('#area').val(),
                baths: $('#baths').val(),
                bhk: $('#bhk').val(),
                price_per_sqft: $('#price_per_sqft').val(),
                city: $('#city').val(),
                location: $('#location').val()
            };

            if (!formData.city || !formData.location) {
                alert('Please select both city and location');
                return;
            }

            $.ajax({
                url: '/predict',
                method: 'POST',
                data: formData,
                success: function (response) {
                    if (response.success) {
                        $('#prediction-value').text(response.prediction);
                        $('#prediction-result').addClass('show').slideDown();

                        // Animate the prediction card
                        gsap.from('#prediction-result', {
                            duration: 0.8,
                            y: 20,
                            opacity: 0,
                            ease: 'power3.out'
                        });
                    } else {
                        alert('Error: ' + response.error);
                    }
                },
                error: function (xhr) {
                    alert('Error making prediction: ' + xhr.responseText);
                }
            });
        });
    </script>
     <footer class="footer">
        © 2025 Property Price Predictor. All rights reserved.
      </footer>
    
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
